name: External Chz no-framework test IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare no-framework test source
        run: python3 prepare_no_framework.py .

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/External-Chz-no-framework.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO archive

      - name: Verify no framework was embedded
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/External-Chz-no-framework.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test ! -e "$APP_PATH/Frameworks/ChzLogin.framework"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "External-Chz-no-framework-${GITHUB_SHA::7}.ipa" Payload
          unzip -t "External-Chz-no-framework-${GITHUB_SHA::7}.ipa"
          mv "External-Chz-no-framework-${GITHUB_SHA::7}.ipa" "$GITHUB_WORKSPACE/"

      - name: Upload test IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-chz-no-framework-ipa
          path: External-Chz-no-framework-*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish test IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="no-framework-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" External-Chz-no-framework-*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "External Chz no-framework test ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned test IPA without external authentication framework. Authentication is a local test shim only; do not use this build for production or licensed distribution."
